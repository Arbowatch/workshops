<style>
  body { visibility: hidden; }
  #auth-overlay { visibility: visible; }
</style>

<script>
  const TEMPORARY_PASSWORD = "arbowatch2025";

  document.addEventListener("DOMContentLoaded", function () {
    if (sessionStorage.getItem("arbowatch_auth") === "true") {
      document.body.style.visibility = "visible";
      return;
    }

    const overlay = document.createElement("div");
    overlay.id = "auth-overlay";
    overlay.innerHTML = `
      <form class="auth-card" id="auth-form">
        <h2>ARBO-WATCH</h2>
        <p>Enter the password shared with your cohort.</p>
        <label for="auth-password">Access password</label>
        <input type="password" id="auth-password" class="auth-input" autocomplete="current-password" />
        <button type="submit" class="auth-btn">View site</button>
        <p id="auth-error" role="alert">That password is incorrect. Try again.</p>
      </form>
    `;

    document.body.appendChild(overlay);

    const form = document.getElementById("auth-form");
    const input = document.getElementById("auth-password");
    const errorMsg = document.getElementById("auth-error");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (input.value === TEMPORARY_PASSWORD) {
        sessionStorage.setItem("arbowatch_auth", "true");
        overlay.remove();
        document.body.style.visibility = "visible";
      } else {
        errorMsg.style.display = "block";
        input.value = "";
        input.focus();
      }
    });

    input.focus();
  });
</script>
